<!doctype html>
<meta charset="utf-8">
<title>lab2</title>
<style>
  html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #e6eaee, #f6f7f9); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
<canvas id="c"></canvas>
<script>if (new URLSearchParams(location.search).get('bg') === 'none') document.documentElement.style.background = document.body.style.background = 'transparent';</script>
<script src="../js/scene.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  window.events = [];
  const hero = SwiftScene.createHero(document.getElementById('c'), {
    preserve: true, static: q.has('static'), noLazy: true, profile: true,
    onEvent: (e) => events.push(e),
    frame: (w, h) => ({ zoom: +(q.get('fz') || 1.2), x: +(q.get('fx') || 0), y: +(q.get('fy') || .02) }),
  });
  window.hero = hero;
  (async () => {
    for (const i of [0, 1, 2]) { const t0 = performance.now(); hero.ensure(i); console.log('ensure', i, Math.round(performance.now() - t0), 'ms'); }
    console.log('draw calls est', hero.renderer.info.render.calls, 'geoms', hero.renderer.info.memory.geometries, 'tex', hero.renderer.info.memory.textures);
    if (q.has('scene')) hero.jumpNow(+q.get('scene'), q.has('empty'));
    else { hero.start(); }
    if (q.has('adv')) await hero.advance(+q.get('adv'));
    (function loop(t) { hero.frame(t); requestAnimationFrame(loop); })(0);
    window.__ready = true;
  })();
  addEventListener('resize', hero.resize);
</script>
